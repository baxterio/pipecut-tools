# Site de présentation de PipeCut (dossier docs/) : vérifié à chaque pull request, publié sur GitHub
# Pages (https://pipecut.app) à chaque fusion dans main.
# Le workflow ne tourne que si docs/ ou ce fichier change ; workflow_dispatch permet de le lancer à la
# main, par exemple pour republier le site.
# pull_request (et non pull_request_target) : le code d'un fork tourne sans secrets, en lecture seule.
# Actions tierces épinglées par commit (un tag peut être déplacé) : pour les mettre à jour, remplacer le
# SHA par celui du nouveau tag (git ls-remote https://github.com/actions/<action> 'refs/tags/v*').
name: Site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même pull request annule la vérification précédente. Sur main, rien n'est
# annulé : une exécution en cours va à son terme, publication comprise, et la suivante attend son tour
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # la version de pnpm est celle du champ packageManager de docs/package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Le site construit n'est transmis à GitHub Pages que depuis main
      - name: Préparer le site pour GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  publier:
    name: Publication sur GitHub Pages
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Une publication en cours va à son terme : la suivante attend son tour
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
